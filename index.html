<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Chat — Coming Back Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --accent: #7c5cfc;
      --accent2: #fc5c7d;
      --text: #f0eeff;
      --muted: #6b6880;
      --glow: rgba(124, 92, 252, 0.35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
      opacity: 0.5;
    }

    /* Gradient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -150px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -180px; right: -100px;
      animation-delay: -6s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.05); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 64px 56px;
      max-width: 560px;
      width: 90%;
      background: rgba(17, 17, 24, 0.7);
      border: 1px solid rgba(124, 92, 252, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Pulse ring on logo */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      margin-bottom: 32px;
      position: relative;
    }
    .logo-wrap::before, .logo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: ring 3s ease-out infinite;
    }
    .logo-wrap::after { animation-delay: 1.5s; }
    @keyframes ring {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .logo-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 32px var(--glow);
      z-index: 1;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #f0eeff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .tagline strong {
      color: var(--text);
      font-style: italic;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      margin: 0 auto 28px;
      opacity: 0.7;
    }

    .from {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .from span {
      color: var(--accent);
    }

    /* Dots loader */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: color-mix(in srgb, var(--accent) 60%, var(--accent2)); }
    .dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent2); }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-10px); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo-wrap">
      <div class="logo-circle">💬</div>
    </div>

    <h1>Vibe Chat<br>is coming back</h1>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <p class="tagline">
      We're fully redoing the code &amp; building<br>
      something <strong>way better</strong> for you.<br>
      Check back shortly — it'll be worth it.
    </p>

    <div class="divider"></div>

    <p class="from">— <span>Billy</span></p>
  </div>

</body>
</html>
